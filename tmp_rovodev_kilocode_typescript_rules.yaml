name: "TypeScript Development Standards"
description: "TypeScript usage standards for both frontend and backend development ensuring type safety and code quality"
version: "1.0.0"
rules:
  - name: "strict-mode-required"
    description: "Ensure TypeScript strict mode is enabled"
    type: "code_quality"
    severity: "error"
    pattern: "\"strict\":\\s*false"
    message: "TypeScript strict mode must be enabled in tsconfig.json"
    files: ["**/tsconfig.json"]

  - name: "no-any-type"
    description: "Avoid using 'any' type in critical data paths"
    type: "code_quality"
    severity: "warning"
    pattern: ":\\s*any\\b|<any>|\\bany\\["
    message: "Avoid the 'any' type, especially in critical data paths. Use proper type annotations."
    files: ["**/*.ts", "**/*.tsx"]
    exclude: ["node_modules/**", "**/*.d.ts"]

  - name: "interface-definitions-required"
    description: "Define interfaces for API requests, responses, and complex data structures"
    type: "code_quality"
    severity: "warning"
    pattern: "(fetch|axios|api).*\\("
    message: "Define interfaces or types for all API responses, props, and complex data structures"
    files: ["**/*.ts", "**/*.tsx"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*interface|.*type\\s+\\w+\\s*=)"

  - name: "proper-error-boundaries"
    description: "Implement proper error boundaries in React components"
    type: "code_quality"
    severity: "warning"
    pattern: "class\\s+\\w+.*extends.*Component"
    message: "Implement proper error boundaries in React components to gracefully handle runtime errors"
    files: ["frontend/**/*.tsx", "frontend/**/*.ts"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*componentDidCatch|.*ErrorBoundary)"

  - name: "eslint-prettier-config"
    description: "Use ESLint and Prettier with consistent configuration"
    type: "style"
    severity: "info"
    pattern: "\\.(js|ts|tsx)$"
    message: "Use ESLint and Prettier with a consistent configuration for code linting and formatting"
    files: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx"]
    conditions:
      - type: "file_path"
        pattern: "(?!.*\\.eslintrc|.*prettier\\.config)"

  - name: "react-memo-optimization"
    description: "Use React.memo for expensive component re-renders"
    type: "performance"
    severity: "info"
    pattern: "export\\s+(default\\s+)?function\\s+\\w+.*\\{[\\s\\S]*useState|useEffect"
    message: "Consider using React.memo() for expensive component re-renders when props are unlikely to change frequently"
    files: ["frontend/**/*.tsx"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*React\\.memo|.*memo\\()"

  - name: "proper-type-annotations"
    description: "Use proper type annotations for function parameters and returns"
    type: "code_quality"
    severity: "warning"
    pattern: "function\\s+\\w+\\s*\\([^)]*\\)\\s*\\{"
    message: "Use proper type annotations for function parameters and return types"
    files: ["**/*.ts", "**/*.tsx"]
    exclude: ["**/*.test.*", "**/*.spec.*"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*:\\s*\\w+)"

  - name: "prisma-types-usage"
    description: "Use Prisma-generated types for database models"
    type: "code_quality"
    severity: "warning"
    pattern: "interface\\s+\\w+.*\\{[\\s\\S]*id:\\s*string"
    message: "Use Prisma-generated types for database models instead of defining custom interfaces"
    files: ["backend/**/*.ts"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*@prisma/client|.*Prisma\\.)"

  - name: "async-error-handling"
    description: "Provide comprehensive error handling for async operations"
    type: "code_quality"
    severity: "warning"
    pattern: "async\\s+function|await\\s+"
    message: "Provide comprehensive error handling for all async operations and external service calls"
    files: ["**/*.ts", "**/*.tsx"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*try.*catch|.*\\.catch\\()"

  - name: "loading-error-states"
    description: "Include loading states and error states in React components"
    type: "code_quality"
    severity: "warning"
    pattern: "useState.*fetch|useEffect.*fetch"
    message: "Include loading states and error states in React components that involve data fetching"
    files: ["frontend/**/*.tsx"]
    conditions:
      - type: "file_content"
        pattern: "(?!.*loading|.*error.*state)"